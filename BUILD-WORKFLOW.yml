name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Excel library
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js

      - name: Create the Android project
        run: npx cap add android

      - name: Add custom code and permissions
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          DIR=android/app/src/main/java/$(echo "$APP_ID" | tr . /)
          mkdir -p "$DIR"
          cp android-overrides/*.java "$DIR/"
          sed -i "s/APP_PACKAGE/$APP_ID/" "$DIR"/*.java
          python3 patch_manifest.py

      - name: Copy the app files into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Workouts-V3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
